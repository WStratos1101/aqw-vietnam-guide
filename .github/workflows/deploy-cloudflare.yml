
name: Deploy AQW Guide to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: aqwvnc-guide-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build website
        run: |
          npm run build
          test -f dist/index.html

      - name: Deploy to existing Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=aqwvnc --branch=guide
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

